[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markstar-studio"
version = "0.2.1"
description = "MarkStar — a Markdown-native terminal word processor (markstar.studio)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ryan Baron de Ropp", email = "daudzegir@gmail.com" }]
dependencies = [
  "textual>=0.80.0",
  "pyspellchecker>=0.8",
  "openai>=1.40",  # StarBot: OpenAI-compatible chat/tool calling (any endpoint)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[project.scripts]
markstar = "markstar.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Coverage is opt-in (keeps the default `pytest` run fast). Enforce the gate with:
#   pytest --cov
# which fails the run if total coverage drops below the floor below.
[tool.coverage.run]
source = ["markstar"]
branch = true

[tool.coverage.report]
# Current branch coverage is ~70%; hold a floor just below so the gate guards
# against regressions without being brittle. Ratchet it up as coverage grows.
fail_under = 68
show_missing = true
skip_covered = false
