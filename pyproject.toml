[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markstar-studio"
version = "0.1.0"
description = "MarkStar — a Markdown-native terminal word processor (markstar.studio)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ryan Baron de Ropp", email = "daudzegir@gmail.com" }]
dependencies = [
  "textual>=0.80.0",
  "pyspellchecker>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
markstar = "markstar.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
